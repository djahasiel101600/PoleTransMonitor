databases:
  - name: poletransmonitor-db
    plan: free
    databaseName: poletransmonitor
    user: poletransmonitor

services:
  - type: redis
    name: poletransmonitor-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: poletransmonitor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py makemigrations && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT --ping-interval 20 --ping-timeout 30 --application-close-timeout 10 config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: poletransmonitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: poletransmonitor-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: poletransmonitor-media
      mountPath: /var/data
      sizeGB: 1
