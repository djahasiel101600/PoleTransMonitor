; PlatformIO Project Configuration File
; A7670E SIMCom Module Test Firmware (ESP32)
; Standalone firmware to verify modem connectivity, signal, and SMS.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -I include
  -DTINY_GSM_MODEM_A7672X
  -DTINY_GSM_DEBUG=Serial
lib_deps =
  vshymanskyy/TinyGSM
  bblanchon/ArduinoJson
